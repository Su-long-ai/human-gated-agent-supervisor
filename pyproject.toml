[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-gated-agent-supervisor"
version = "0.1.0"
description = "Local-first multi-agent supervisor with leases, heartbeats and human gates"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sulong"}]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.urls]
Repository = "https://github.com/Su-long-ai/human-gated-agent-supervisor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
