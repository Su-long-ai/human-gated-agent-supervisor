[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-gated-agent-supervisor"
version = "0.1.0"
description = "Local-first multi-agent supervisor with leases, heartbeats and human gates"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sulong"}]

[tool.setuptools.packages.find]
where = ["src"]
